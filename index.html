<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineBridge</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e0a;
    --bg2: #111711;
    --bg3: #1a211a;
    --border: #2a3a2a;
    --green: #4ade80;
    --green2: #22c55e;
    --green-dim: #166534;
    --dirt: #92400e;
    --stone: #6b7280;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e2e8e2;
    --text2: #9ca89c;
    --pixel: 'Press Start 2P', monospace;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Pixel grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── AUTH EKRANI ── */
  #auth-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: var(--bg);
  }
  .auth-box {
    background: var(--bg2);
    border: 2px solid var(--green-dim);
    width: 380px;
    padding: 40px 36px;
    position: relative;
  }
  .auth-box::before {
    content: '';
    position: absolute;
    top: -6px; left: -6px; right: -6px; bottom: -6px;
    border: 1px solid rgba(74,222,128,0.1);
    pointer-events: none;
  }
  .auth-logo {
    font-family: var(--pixel);
    font-size: 13px;
    color: var(--green);
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .auth-logo span {
    color: var(--text2);
    font-size: 8px;
    display: block;
    margin-top: 6px;
    letter-spacing: 3px;
  }
  .auth-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin: 28px -36px 24px;
    padding: 0 36px;
  }
  .auth-tab {
    flex: 1;
    padding: 10px 0;
    background: none;
    border: none;
    color: var(--text2);
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all .2s;
  }
  .auth-tab.active { color: var(--green); border-bottom-color: var(--green); }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .field input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: var(--green-dim); }

  .btn {
    width: 100%;
    padding: 12px;
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid var(--green-dim);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .2s;
    margin-top: 8px;
  }
  .btn:hover { background: #14532d; border-color: var(--green); }
  .btn.danger { background: #450a0a; color: var(--red); border-color: #7f1d1d; }
  .btn.danger:hover { background: #7f1d1d; border-color: var(--red); }
  .btn.sm { width: auto; padding: 7px 14px; font-size: 11px; margin-top: 0; }
  .btn.outline { background: transparent; border-color: var(--border); color: var(--text2); }
  .btn.outline:hover { border-color: var(--green-dim); color: var(--green); }

  .error-msg { color: var(--red); font-size: 11px; margin-top: 10px; display: none; }
  .error-msg.show { display: block; }

  /* ── DASHBOARD ── */
  #app { display: none; min-height: 100vh; position: relative; z-index: 1; }

  /* Navbar */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,10,0.9);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .nav-logo { font-family: var(--pixel); font-size: 10px; color: var(--green); letter-spacing: 2px; }
  .nav-user { display: flex; align-items: center; gap: 16px; }
  .nav-username { font-size: 12px; color: var(--text2); }
  .nav-username span { color: var(--green); }

  /* Content */
  .content { max-width: 900px; margin: 0 auto; padding: 40px 24px; }

  /* Section header */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .section-title {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--green);
    letter-spacing: 2px;
  }

  /* Server cards */
  .servers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .servers-grid { grid-template-columns: 1fr; } }

  .server-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 20px;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    overflow: hidden;
  }
  .server-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--green-dim);
    transition: background .2s;
  }
  .server-card:hover { border-color: var(--green-dim); }
  .server-card:hover::after { background: var(--green); }

  .card-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .card-desc { font-size: 11px; color: var(--text2); margin-bottom: 14px; min-height: 16px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .status-dot {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--text2);
  }
  .status-dot::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--stone);
  }
  .status-dot.online { color: var(--green); }
  .status-dot.online::before { background: var(--green); box-shadow: 0 0 6px var(--green); }

  .card-id { font-size: 10px; color: var(--border); font-family: var(--mono); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    border: 1px dashed var(--border);
    color: var(--text2);
  }
  .empty-icon { font-family: var(--pixel); font-size: 20px; margin-bottom: 16px; color: var(--border); }
  .empty-text { font-size: 12px; line-height: 1.8; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    width: 480px;
    max-width: 95vw;
    padding: 32px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-title {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--green);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none;
    color: var(--text2); font-size: 18px;
    cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  /* Server detail */
  .detail-row {
    display: flex; align-items: flex-start;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    gap: 12px;
  }
  .detail-row:last-of-type { border-bottom: none; }
  .detail-label { color: var(--text2); min-width: 110px; }
  .detail-val { color: var(--text); word-break: break-all; text-align: right; }
  .detail-val.green { color: var(--green); }
  .detail-val.copy {
    cursor: pointer; border-bottom: 1px dashed var(--green-dim);
    transition: color .15s;
  }
  .detail-val.copy:hover { color: var(--green); }

  .invite-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 14px;
    margin: 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .invite-code { font-size: 16px; letter-spacing: 3px; color: var(--green); }
  .invite-link { font-size: 10px; color: var(--text2); margin-top: 4px; word-break: break-all; }

  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--bg3);
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-size: 12px;
    padding: 12px 20px;
    z-index: 999;
    transform: translateY(60px);
    opacity: 0;
    transition: all .3s;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* Loader */
  .loader {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider { height: 1px; background: var(--border); margin: 24px 0; }

  .joined-label {
    font-size: 9px;
    font-family: var(--pixel);
    color: var(--text2);
    letter-spacing: 2px;
    margin-top: 40px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">MINEBRIDGE<span>DECENTRALIZED SERVERS</span></div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Giriş</button>
      <button class="auth-tab" onclick="switchTab('register')">Kayıt</button>
    </div>

    <!-- Login -->
    <div id="login-form">
      <div class="field"><label>KULLANICI ADI</label><input id="l-user" type="text" placeholder="herobrine" autocomplete="username"></div>
      <div class="field"><label>ŞİFRE</label><input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="error-msg" id="login-err"></div>
      <button class="btn" onclick="doLogin()">GİRİŞ YAP</button>
    </div>

    <!-- Register -->
    <div id="register-form" style="display:none">
      <div class="field"><label>KULLANICI ADI</label><input id="r-user" type="text" placeholder="herobrine"></div>
      <div class="field"><label>E-POSTA</label><input id="r-email" type="email" placeholder="steve@minecraft.net"></div>
      <div class="field"><label>ŞİFRE</label><input id="r-pass" type="password" placeholder="min. 6 karakter"></div>
      <div class="error-msg" id="register-err"></div>
      <button class="btn" onclick="doRegister()">KAYIT OL</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav class="navbar">
    <div class="nav-logo">⛏ MINEBRIDGE</div>
    <div class="nav-user">
      <span class="nav-username">Merhaba, <span id="nav-username-text">—</span></span>
      <button class="btn sm outline" onclick="doLogout()">Çıkış</button>
    </div>
  </nav>

  <div class="content">
    <!-- Kendi sunucuları -->
    <div class="section-header">
      <div class="section-title">⬛ SUNUCULARIM</div>
      <button class="btn sm" onclick="openCreateModal()">+ Yeni Sunucu</button>
    </div>
    <div id="my-servers" class="servers-grid"></div>

    <!-- Üye olunan sunucular -->
    <div class="joined-label">▸ KATILDIĞIM SUNUCULAR</div>
    <div id="joined-servers" class="servers-grid"></div>
  </div>
</div>

<!-- SUNUCU OLUŞTUR MODAL -->
<div class="modal-overlay" id="create-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('create-modal')">✕</button>
    <div class="modal-title">YENİ SUNUCU</div>
    <div class="field"><label>SUNUCU ADI</label><input id="new-name" type="text" placeholder="Benim Sunucum"></div>
    <div class="field"><label>AÇIKLAMA (opsiyonel)</label><input id="new-desc" type="text" placeholder="Arkadaşlarla survival..."></div>
    <div class="error-msg" id="create-err"></div>
    <button class="btn" onclick="doCreateServer()">OLUŞTUR</button>
  </div>
</div>

<!-- SUNUCU DETAY MODAL -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('detail-modal')">✕</button>
    <div class="modal-title" id="detail-title">SUNUCU</div>

    <div id="detail-body"></div>
  </div>
</div>

<!-- DAVET GÖNDER MODAL -->
<div class="modal-overlay" id="invite-join-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('invite-join-modal')">✕</button>
    <div class="modal-title">SUNUCUYA KATIL</div>
    <div class="field"><label>DAVET KODU</label><input id="join-code" type="text" placeholder="abc123XY"></div>
    <div class="error-msg" id="join-err"></div>
    <button class="btn" onclick="doJoinServer()">KATIL</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
const API = 'http://localhost:8000';
let token = localStorage.getItem('mb_token');
let me = null;
let currentServer = null;

// ── BAŞLANGIÇ ──
window.onload = () => {
  if (token) loadApp();
};

// ── AUTH ──
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
  document.getElementById('login-form').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
}

async function doLogin() {
  const user = document.getElementById('l-user').value.trim();
  const pass = document.getElementById('l-pass').value;
  const err = document.getElementById('login-err');
  err.classList.remove('show');
  if (!user || !pass) { showErr(err, 'Tüm alanları doldur'); return; }
  try {
    const r = await api('/api/auth/login', 'POST', { username: user, password: pass });
    token = r.token;
    localStorage.setItem('mb_token', token);
    loadApp();
  } catch(e) { showErr(err, e.message.includes('fetch') ? 'api.py çalışmıyor! Terminalde: py api.py' : e.message); }
}

async function doRegister() {
  const user = document.getElementById('r-user').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass = document.getElementById('r-pass').value;
  const err = document.getElementById('register-err');
  err.classList.remove('show');
  if (!user || !email || !pass) { showErr(err, 'Tüm alanları doldur'); return; }
  try {
    const r = await api('/api/auth/register', 'POST', { username: user, email, password: pass });
    token = r.token;
    localStorage.setItem('mb_token', token);
    loadApp();
  } catch(e) { showErr(err, e.message.includes('fetch') ? 'api.py çalışmıyor! Terminalde: py api.py' : e.message); }
}

async function doLogout() {
  try { await api('/api/auth/logout', 'POST'); } catch(e) {}
  localStorage.removeItem('mb_token');
  token = null; me = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

// ── UYGULAMA ──
async function loadApp() {
  try {
    me = await api('/api/auth/me');
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('nav-username-text').textContent = me.username;
    await refreshServers();
  } catch(e) {
    localStorage.removeItem('mb_token');
    token = null;
  }
}

async function refreshServers() {
  const [mine, joined] = await Promise.all([
    api('/api/servers'),
    api('/api/servers/joined/list')
  ]);

  renderServers('my-servers', mine, true);
  renderServers('joined-servers', joined, false);
}

function renderServers(containerId, servers, showCreate) {
  const el = document.getElementById(containerId);
  if (!servers.length) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">${showCreate ? '□' : '○'}</div>
      <div class="empty-text">${showCreate
        ? 'Henüz sunucun yok.<br>Yeni bir Minecraft dünyası başlat!'
        : 'Henüz hiçbir sunucuya katılmadın.<br><a href="#" onclick="openJoinModal()" style="color:var(--green)">Davet koduyla katıl →</a>'
      }</div>
    </div>`;
    return;
  }
  el.innerHTML = servers.map(s => `
    <div class="server-card" onclick="openDetail('${s.id}')">
      <div class="card-name">${esc(s.name)}</div>
      <div class="card-desc">${esc(s.description || '')}</div>
      <div class="card-footer">
        <span class="status-dot ${s.status === 'online' ? 'online' : ''}">${s.status || 'offline'}</span>
        <span class="card-id">${s.id.slice(0,8)}…</span>
      </div>
    </div>
  `).join('');
}

// ── SUNUCU OLUŞTUR ──
function openCreateModal() { openModal('create-modal'); }

async function doCreateServer() {
  const name = document.getElementById('new-name').value.trim();
  const desc = document.getElementById('new-desc').value.trim();
  const err = document.getElementById('create-err');
  err.classList.remove('show');
  if (!name) { showErr(err, 'Sunucu adı gerekli'); return; }
  try {
    await api('/api/servers', 'POST', { name, description: desc });
    closeModal('create-modal');
    document.getElementById('new-name').value = '';
    document.getElementById('new-desc').value = '';
    showToast('Sunucu oluşturuldu!');
    await refreshServers();
  } catch(e) { showErr(err, e.message.includes('fetch') ? 'api.py çalışmıyor! Terminalde: py api.py' : e.message); }
}

// ── SUNUCU DETAY ──
async function openDetail(serverId) {
  const server = await api(`/api/servers/${serverId}`);
  currentServer = server;
  document.getElementById('detail-title').textContent = server.name.toUpperCase();

  const isOwner = server.owner_id === me.user_id;
  const ipVal = server.tunnel_url
    ? `<span class="detail-val green copy" onclick="copyText('${server.tunnel_url}')">${server.tunnel_url} 📋</span>`
    : `<span class="detail-val" style="color:var(--stone)">Çevrimdışı</span>`;

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-row">
      <span class="detail-label">Durum</span>
      <span class="status-dot ${server.status === 'online' ? 'online' : ''}" style="font-size:12px">${server.status || 'offline'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Sunucu IP</span>
      ${ipVal}
    </div>
    <div class="detail-row">
      <span class="detail-label">Dünya Yedeği</span>
      ${server.world_backup_url
        ? `<a href="${server.world_backup_url}" target="_blank" class="detail-val green">İndir →</a>`
        : `<span class="detail-val" style="color:var(--stone)">Yok</span>`
      }
    </div>
    <div class="detail-row">
      <span class="detail-label">Oluşturulma</span>
      <span class="detail-val">${new Date(server.created_at).toLocaleDateString('tr')}</span>
    </div>
    ${server.last_seen ? `<div class="detail-row">
      <span class="detail-label">Son görülme</span>
      <span class="detail-val">${new Date(server.last_seen).toLocaleString('tr')}</span>
    </div>` : ''}

    ${isOwner ? `
    <div class="divider"></div>
    <div class="modal-title" style="font-size:8px;margin-bottom:16px">DAVET LİNKİ</div>
    <div id="invite-result"></div>
    <button class="btn sm" onclick="generateInvite('${server.id}')">Davet Kodu Oluştur</button>
    <div class="divider"></div>
    <div class="actions-row">
      <button class="btn sm danger" onclick="doDeleteServer('${server.id}')">Sunucuyu Sil</button>
    </div>
    ` : ''}
  `;

  openModal('detail-modal');
}

async function generateInvite(serverId) {
  try {
    const r = await api('/api/invites', 'POST', { server_id: serverId });
    const link = `${window.location.origin}?join=${r.invite_code}`;
    document.getElementById('invite-result').innerHTML = `
      <div class="invite-box">
        <div>
          <div class="invite-code">${r.invite_code}</div>
          <div class="invite-link">${link}</div>
        </div>
        <button class="btn sm" onclick="copyText('${link}')">Kopyala</button>
      </div>
    `;
    showToast('Davet kodu oluşturuldu!');
  } catch(e) { showToast('Hata: ' + e.message); }
}

async function doDeleteServer(serverId) {
  if (!confirm('Bu sunucuyu silmek istediğinden emin misin?')) return;
  try {
    await api(`/api/servers/${serverId}`, 'DELETE');
    closeModal('detail-modal');
    showToast('Sunucu silindi');
    await refreshServers();
  } catch(e) { showToast('Hata: ' + e.message); }
}

// ── SUNUCUYA KATIL ──
function openJoinModal() { openModal('invite-join-modal'); }

async function doJoinServer() {
  const code = document.getElementById('join-code').value.trim();
  const err = document.getElementById('join-err');
  err.classList.remove('show');
  if (!code) { showErr(err, 'Davet kodu gerekli'); return; }
  try {
    const r = await api(`/api/invites/join/${code}`);
    closeModal('invite-join-modal');
    document.getElementById('join-code').value = '';
    showToast(`"${r.server.name}" sunucusuna katıldın!`);
    await refreshServers();
  } catch(e) { showErr(err, e.message.includes('fetch') ? 'api.py çalışmıyor! Terminalde: py api.py' : e.message); }
}

// URL'den join parametresi varsa otomatik aç
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const joinCode = params.get('join');
  if (joinCode && token) {
    document.getElementById('join-code').value = joinCode;
    openModal('invite-join-modal');
  }
});

// ── YARDIMCILAR ──
async function api(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (token) opts.headers['Authorization'] = `Bearer ${token}`;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || 'Bağlantı hatası! Önce bilgisayarında api.py\'yi başlat: py api.py');
  return data;
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showErr(el, msg) { el.textContent = '⚠ ' + msg; el.classList.add('show'); }
function esc(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function copyText(txt) {
  navigator.clipboard.writeText(txt).then(() => showToast('Kopyalandı!'));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
